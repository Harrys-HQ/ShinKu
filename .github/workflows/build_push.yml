name: Release Builder
on:
  push:
   branches:
    - 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      # SY -->
      - name: Write google-services.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_TEXT }}
          write-mode: overwrite

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite
      # SY <--

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew assembleDevRelease

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest testDevReleaseUnitTest

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/dev/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        run: |
          set -e

          mv app/build/outputs/apk/dev/release/*-universal-*-signed.apk ShinKu-universal.apk
          mv app/build/outputs/apk/dev/release/*-arm64-v8a-*-signed.apk ShinKu-arm64-v8a.apk
          mv app/build/outputs/apk/dev/release/*-armeabi-v7a-*-signed.apk ShinKu-armeabi-v7a.apk
          mv app/build/outputs/apk/dev/release/*-x86-*-signed.apk ShinKu-x86.apk
          mv app/build/outputs/apk/dev/release/*-x86_64-*-signed.apk ShinKu-x86_64.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: ShinKu
          body: |
            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `ShinKu-arm64-v8a.apk` (or `ShinKu-universal.apk`)
          files: |
            ShinKu-universal.apk
            ShinKu-arm64-v8a.apk
            ShinKu-armeabi-v7a.apk
            ShinKu-x86.apk
            ShinKu-x86_64.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
